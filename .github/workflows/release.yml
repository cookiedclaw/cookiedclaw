name: release

# Triggered by pushing a version tag (e.g. `v0.1.0`). Builds the gateway
# as a single self-contained executable for each supported platform and
# attaches the binaries to a GitHub Release. End users `curl` the binary
# they need — no Bun install required on their host.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            bun_target: bun-linux-x64
          - target: linux-arm64
            # ubuntu-24.04-arm is GitHub's free arm64 runner; falls back
            # cleanly to ubuntu-latest with cross-compile if quotas hit.
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
          - target: darwin-arm64
            runner: macos-latest
            bun_target: bun-darwin-arm64
          # darwin-x64 dropped — GitHub's macos-13 (x64) free runner is
          # gone, and Apple Silicon is the only macOS that matters for
          # new installs. Add back via macos-14-large or self-hosted
          # runner if Intel-mac demand shows up.

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile gateway
        run: |
          mkdir -p dist
          bun build --compile \
            --target=${{ matrix.bun_target }} \
            ./src/gateway.ts \
            --outfile dist/cookiedclaw-gateway-${{ matrix.target }}

      - name: Generate checksum
        run: |
          cd dist
          shasum -a 256 cookiedclaw-gateway-${{ matrix.target }} \
            > cookiedclaw-gateway-${{ matrix.target }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookiedclaw-gateway-${{ matrix.target }}
          path: |
            dist/cookiedclaw-gateway-${{ matrix.target }}
            dist/cookiedclaw-gateway-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cookiedclaw-gateway-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/cookiedclaw-gateway-*
          fail_on_unmatched_files: true
