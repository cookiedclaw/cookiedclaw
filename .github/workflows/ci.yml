name: ci

# Smoke checks on every push to main and on every PR: typecheck, plus a
# single-platform compile to catch entry-point breakage early. Full
# multi-platform builds run on tag push (see release.yml).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke compile (linux-x64)
        run: bun run build:linux-x64

      - name: Verify binary runs
        run: |
          COOKIEDCLAW_GATEWAY_TOKEN=ci-smoke-test \
          GATEWAY_PORT=47393 \
          timeout 3 ./dist/cookiedclaw-gateway-linux-x64 \
            > /tmp/gateway.stdout 2> /tmp/gateway.stderr || true
          # Exit 124 (timeout) means the gateway started cleanly and
          # we killed it. Anything else is a startup failure.
          grep -F "MCP-over-HTTP on http" /tmp/gateway.stderr

      - name: Verify --version subcommand
        run: |
          # --version must succeed WITHOUT any env vars set — it's the
          # first thing install.sh runs to decide install-vs-upgrade, on
          # a machine where keys.env doesn't yet exist.
          OUT="$(./dist/cookiedclaw-gateway-linux-x64 --version)"
          echo "version output: $OUT"
          # Must be a semver-shaped string, no warnings, no env-related noise.
          echo "$OUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Verify --help subcommand
        run: |
          ./dist/cookiedclaw-gateway-linux-x64 --help | grep -F 'cookiedclaw-gateway update'

      - name: Verify version.ts matches package.json shape
        run: |
          # Guard against forgetting to bump version.ts in a release PR.
          # Fails CI if anyone leaves a placeholder string in there.
          grep -Eq 'VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' src/version.ts
